<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="left">
        <div class="bg-img">
            <div class="left-title">
                <img src="imgs/odin-lined.png">
                <p class="text"> ODIN</p>
            </div>
            <p>Photo by <a target="_blank" href="https://unsplash.com/pt-br/@haliewestphoto">Halie West</a> on <a
                    target="_blank"
                    href="https://unsplash.com/pt-br/fotografias/planta-da-folha-verde-na-fotografia-de-perto-25xggax4bSA">Unsplash</a>
            </p>
        </div>
    </div>
    <div class="right">
        <div class="text-space">
            <p>This is not a real online service! You know you need something
                like this in your life to help you realize your deepest dreams.
                Sign up <i>now</i> to get started.</p>
            <p>You <i>know</i> you want to.</p>
        </div>
        <div class="form-space">
            <p>Let's do this!</p>
            <form id="the-form"action="">
                <div class="form-item">
                    <label for="name">FIRST NAME</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-item">
                    <label for="last_name">LAST NAME</label>
                    <input type="text" id="last_name" required>
                </div>
                <div class="form-item">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-item">
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone">
                </div>
                <div class="form-item">
                    <label for="password">PASSWORD</label>
                    <input type="" id="password" minlength="8" maxlength="16"
                        pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$" required>
                </div>
                <div class="form-item">
                    <label for="confirm_password">CONFIRM PASSWORD</label>
                    <input type="" id="confirm_password" minlength="8" maxlength="16"
                        pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$" required>
                </div>
            </form>
        </div>
        <div class="bottom">
            <input type="submit" form="the-form" value="Create Account">
            <p>Already have an account? <a href="">Log in</a></p>
        </div>
    </div>
</body>

</html>
